# Example migrate configuration
# install.sh installs this as configs/migrate.toml (only when that file doesn't exist yet).
#
# A migration captures on the source machine (--from, default this machine), then restores
# on the destination (--to, default this machine); at least one of them is a host.
# [capture.*] is the source's capture config and [restore.*] the destination's restore
# config, with the same keys as capture.toml and restore.toml.

[tarball]
compress = "gzip"
checksum = "sha256"     # always sha256 (the only supported value)
rollback = ".bak"  # Extension for backing up existing files during restore

#
# Capture configuration ([capture.*])
#

# Scripts run with 'molt migrate --run-scripts', on the SOURCE machine, in the snapshot
[capture.scripts]
after = ["scripts/capture-brew.sh"]   # Saves a Brewfile in the snapshot
# before = ["scripts/dump-database.sh"]

# Recipients for archives with 'encrypt = true'; the source needs the age CLI
# [capture.age]
# recipients = ["age1..."]
# recipients_file = "~/.config/age/recipients.txt"

# A draft install.toml of what the source machine has installed, saved in the snapshot
# [capture.install]
# draft = true

# SSH keys
[capture.tar.ssh-keys]
root = "$HOME"
dirs = [".ssh"]
# encrypt = true

# User dotfiles
[capture.tar.dotfiles]
root = "$HOME"
files = [
    ".*rc",
    ".bash_*",
    ".gitconfig",
]

# All config directories, without caches
[capture.tar.config]
root = "$HOME"
dirs = [".config/*"]
exclude = ["node_modules", "*.log", "*/Cache/*"]

# Application code and configuration (an example: /opt/myapp doesn't exist on most machines)
# [capture.tar.myapp]
# root = "/opt/myapp"
# link = "$HOME/myapp"  # Creates symlink: ~/myapp -> /opt/myapp
# dirs = ["bin", "lib", "config"]

# System configuration (restoring it needs sudo on the destination)
# [capture.tar.system]
# root = "/etc"
# dirs = ["nginx", "systemd/system"]
# files = ["hosts"]

#
# Restore configuration ([restore.*])
#

[restore.tar]
archives = ["*"]

# Your age identity file on the DESTINATION, for encrypted archives
# [restore.age]
# identity = "~/.config/age/key.txt"

# Scripts run with 'molt migrate --run-scripts', on the DESTINATION machine, in the snapshot
[restore.scripts]
after = ["scripts/restore-brew.sh"]   # Installs the captured Brewfile
# before = ["scripts/stop-services.sh"]
