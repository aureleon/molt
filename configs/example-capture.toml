# Example capture configuration
# install.sh installs this as configs/capture.toml (only when that file doesn't exist yet).
# Try it with 'molt capture --dry-run' before the first real capture.

# Each [tar.<name>] table becomes one archive, <name>.tar.gz, in the snapshot.

[tarball]
compress = "gzip"   # gzip, bzip2, xz, or "" (none)
checksum = "sha256"     # always sha256 (the only supported value)
rollback = ".bak"   # A restore moves replaced files to <root>.bak/<name>

# Who can decrypt the archives that set 'encrypt = true' (see the age section in README.md).
# Needs the age CLI (brew install age, or apt install age).
# [age]
# recipients = ["age1..."]                          # age public keys
# recipients_file = "~/.config/age/recipients.txt"  # a file of them, expanded like a root

# SSH keys and known_hosts
[tar.ssh-keys]
root = "$HOME"
dirs = [".ssh"]
# encrypt = true    # Encrypt this archive with age, for the [age] recipients

# Shell dotfiles using glob patterns
[tar.dotfiles]
root = "$HOME"
files = [
    ".*rc",           # Matches .bashrc, .zshrc, .vimrc, etc.
    ".bash_*",        # Matches .bash_profile, .bash_history, etc.
    ".gitconfig",
    ".gitignore_global",
]

# All config directories
[tar.config]
root = "$HOME"
dirs = [
    ".config/*",      # All subdirs: nvim, fish, i3, etc.
]
# Left out of the archive: a pattern matches the path relative to root, or any one part of it
exclude = [
    "node_modules",   # anything named node_modules, at any depth
    "*.log",          # any name ending in .log
    "*/Cache/*",      # everything below a Cache directory
]

# The tables below are examples for other kinds of data. Uncomment and adapt the ones you
# need: they name paths that don't exist on most machines, and restoring system paths
# (/etc, /usr/local) needs sudo.

# Application data
# [tar.local]
# root = "$HOME/.local/share"
# dirs = [
#     "applications",
#     "fonts",
# ]

# Development tools (large)
# [tar.dev-tools]
# root = "$HOME"
# dirs = [
#     ".cargo",
#     ".rustup",
#     ".npm",
# ]
# exclude = [".cargo/registry/cache", ".npm/_cacache"]

# Homebrew (macOS, Intel); scripts/capture-brew.sh saves a Brewfile instead
# [tar.homebrew]
# root = "/usr/local"
# dirs = ["Cellar", "Caskroom"]
# files = ["bin/brew"]

# Custom application with symlink
# The 'link' key creates a symlink during restore: link -> root
# [tar.myapp]
# root = "/opt/myapp"
# link = "$HOME/myapp"  # Creates symlink: ~/myapp -> /opt/myapp
# dirs = ["bin", "lib", "config"]

# External volume with symlink
# [tar.workspace]
# root = "/Volumes/workplace"
# link = "$HOME/workplace"  # Creates symlink: ~/workplace -> /Volumes/workplace
# dirs = ["projects", "repos"]

# System configuration (restoring it needs sudo)
# [tar.system]
# root = "/etc"
# dirs = [
#     "nginx",
#     "systemd/system",
# ]
# files = [
#     "hosts",
#     "fstab",
# ]

# Log files using patterns
# [tar.logs]
# root = "/var/log"
# files = [
#     "*.log",          # All .log files in /var/log
#     "nginx/*.log",    # All logs in nginx subdirectory
# ]

# Save a draft install.toml of what is installed (Homebrew, App Store apps, mise, npm,
# cargo, uv, VS Code, other apps) in the snapshot; on a new machine, review it, then
# 'molt install -t <snapshot>/install.toml'
# [install]
# draft = true

# Scripts to run before/after the capture, with 'molt capture --run-scripts'.
# Paths are relative to the molt root; after scripts run in the new snapshot directory,
# so capture-brew.sh saves the Brewfile in the snapshot
[scripts]
# before = ["scripts/dump-database.sh"]
after = ["scripts/capture-brew.sh"]
