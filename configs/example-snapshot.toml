# Example snapshot.toml, for reference only (install.sh doesn't install it).
# molt.py capture writes one into each snapshot directory,
# captures/YYYY/MM-DD/<snapshot id>/snapshot.toml; a restore reads it to verify the
# archives and to find each archive's root and link.

# Snapshot written by molt.py capture
[tarball]
# compress = "xz"      # Written only when not gzip
rollback = ".bak"      # The capture config's rollback extension
checksum = "sha256"

# One [tar.<name>] table per archive, <name>.tar.gz, in name order
[tar.dotfiles]
root = "$HOME"
checksum = "c38ec3d045454cc0aa1ee6fb541c888650b9f6dec67dcf958d165e6aa1c9c98e"

# An archive captured with 'encrypt = true': ssh-keys.tar.gz.age, and the checksum is over
# the .age file
[tar."ssh-keys"]
root = "$HOME"
encrypted = true
checksum = "918b54e9318ab121cb8b197916c1ecde85204e2ceefafc3ccca87c09a78a4ee2"

# An archive with a link: a restore creates ~/workplace -> /Volumes/workplace
[tar.workspace]
root = "/Volumes/workplace"
link = "$HOME/workplace"
checksum = "3f2275e7eb4a5400c23bb8cc1f3832543f83d661db556a2520c335a4b6d5daf1"
