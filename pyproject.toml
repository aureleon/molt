# Settings for the tools ./check.sh runs. molt.py is a single script, not a pip package:
# install it with ./install.sh.

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["F", "E", "W", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
markers = [
    "slow: end-to-end tests that run molt.py or install.sh in a subprocess (./check.sh --fast skips them)",
]
